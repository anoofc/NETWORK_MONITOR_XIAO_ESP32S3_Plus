[platformio]
default_envs = xiao_ssd1306

[env]
platform = espressif32@6.12.0
board = seeed_xiao_esp32s3
framework = arduino
platform_packages = platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
lib_deps = olikraus/U8g2@2.36.12
monitor_speed = 115200
build_flags = -Wall -Wextra

[env:xiao_ssd1306]

[env:xiao_sh1106]
build_flags = ${env.build_flags} -DNET_DISPLAY_SH1106=1

[env:demo]
build_flags = ${env.build_flags} -DNET_DEMO=1
